name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT, LuaSocket, luacheck
        run: sudo apt-get update && sudo apt-get install -y luajit lua-socket lua-filesystem lua-check curl
      - name: Run tests
        run: ./tests/run.sh
